name: Release current Windows and macOS
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag with a locally verified Windows installer in its draft release
        required: true
        default: v0.5.2
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - name: Download and verify the original Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$version"
          name="ZiyunStudio-Setup-$version.exe"
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -x true
          gh release download "$RELEASE_TAG" --pattern "$name" --dir windows-original
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const receipt = require(`./.github/local-windows-v${version}.json`);
          const name = `ZiyunStudio-Setup-${version}.exe`;
          assert.equal(receipt.version, version);
          assert.equal(receipt.fileName, name);
          const bytes = fs.readFileSync(`windows-original/${name}`);
          assert.equal(bytes.length, receipt.size);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), receipt.sha256);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: local-windows-installer
          path: windows-original/*.exe
          if-no-files-found: error
          retention-days: 3

  build:
    needs: prepare-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: windows, arch: x64}
          - {runner: macos-15, platform: mac, arch: arm64}
          - {runner: macos-15-intel, platform: mac, arch: x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify tagged application inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -s ".github/local-windows-$RELEASE_TAG.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Download and verify the locked Electron runtime
        if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("electron/package.json").version')
          archive=$(node -p '"electron-v" + require("electron/package.json").version + "-" + process.platform + "-" + process.arch + ".zip"')
          asset=$(gh api "repos/electron/electron/releases/tags/v$version" --jq ".assets[] | select(.name == \"$archive\") | .id")
          [[ "$asset" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/electron-dist"
          file="$RUNNER_TEMP/electron-dist/$archive"
          gh api --allow-escape-sequences "repos/electron/electron/releases/assets/$asset" -H 'Accept: application/octet-stream' > "$file"
          ARCHIVE_PATH="$file" ARCHIVE_NAME="$archive" node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const expected = require('./node_modules/electron/checksums.json')[process.env.ARCHIVE_NAME];
          assert.match(expected, /^[a-f0-9]{64}$/);
          const actual = crypto.createHash('sha256').update(fs.readFileSync(process.env.ARCHIVE_PATH)).digest('hex');
          assert.equal(actual, expected);
          console.log(`Verified official Electron archive: ${process.env.ARCHIVE_NAME}`);
          NODE
          echo "ELECTRON_DIST_ARCHIVE=$file" >> "$GITHUB_ENV"
      - name: Prepare isolated media test runtime
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/media-test"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/media-test/Scripts/python.exe"; else py="$RUNNER_TEMP/media-test/bin/python"; fi
          "$py" -m pip install --only-binary=:all: imageio-ffmpeg==0.6.0
          ffmpeg=$("$py" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          echo "ZIYUN_FFMPEG_PATH=$ffmpeg" >> "$GITHUB_ENV"
          "$ffmpeg" -hide_banner -filters | grep -E '[[:space:]]subtitles[[:space:]]'
      - name: Service and actual media tests
        run: npm test
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: local-windows-installer
          path: release/${{ env.PACKAGE_VERSION }}
      - name: Install the verified Windows x64 package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path -LiteralPath "release/$version/ZiyunStudio-Setup-$version.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'ZiyunStudio'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S','/currentuser',('/D='+$destination)) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { throw 'Installer timed out' }
          if ($process.ExitCode) { throw "Installer failed: $($process.ExitCode)" }
          $exe = (Resolve-Path -LiteralPath (Join-Path $destination '子云影像工坊.exe')).Path
          "ZIYUN_TEST_EXE=$exe" >> $env:GITHUB_ENV
      - name: Build macOS disk image
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node node_modules/electron-builder/out/cli/cli.js --mac dmg --${{ matrix.arch }} --publish never --config.electronDist="$ELECTRON_DIST_ARCHIVE"
          version=$(node -p 'require("./package.json").version')
          app=$(find "release/$version" -name '子云影像工坊.app' -type d -print -quit)
          test -n "$app"
          exe="$app/Contents/MacOS/子云影像工坊"
          file "$exe" | grep -E '${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}'
          codesign --verify --deep --strict "$app"
          hdiutil verify "release/$version/ZiyunStudio-$version-mac-${{ matrix.arch }}.dmg"
          mounted=$(mktemp -d)
          hdiutil attach "release/$version/ZiyunStudio-$version-mac-${{ matrix.arch }}.dmg" -readonly -nobrowse -mountpoint "$mounted"
          trap 'hdiutil detach "$mounted"' EXIT
          installed="$RUNNER_TEMP/installed/子云影像工坊.app"
          mkdir -p "$RUNNER_TEMP/installed"
          ditto "$mounted/子云影像工坊.app" "$installed"
          codesign --verify --deep --strict "$installed"
          echo "ZIYUN_TEST_EXE=$installed/Contents/MacOS/子云影像工坊" >> "$GITHUB_ENV"
      - name: Installed application persistence
        timeout-minutes: 4
        run: node scripts/verify-installed.mjs
      - name: Installed batch, editor and export flow
        timeout-minutes: 12
        run: node scripts/verify-batch-montage.mjs
      - name: Installed Excel import and batch operations
        timeout-minutes: 6
        run: node scripts/verify-image-batch.mjs
      - name: Installed image row selection and deletion
        timeout-minutes: 4
        run: node scripts/verify-image-rows.mjs
      - name: Installed image task center and version display
        if: hashFiles('scripts/verify-image-task-center.mjs') != ''
        timeout-minutes: 4
        run: node scripts/verify-image-task-center.mjs
      - name: Installed mother image folders and child output
        timeout-minutes: 6
        run: node scripts/verify-image-folder.mjs
      - name: Installed AI review and approval flow
        timeout-minutes: 6
        run: node scripts/verify-montage-review.mjs
      - name: Installed credential recovery and legacy compatibility
        timeout-minutes: 6
        run: node scripts/verify-credential-storage.mjs
      - name: Installed model selection and connection names
        timeout-minutes: 6
        run: node scripts/verify-model-settings.mjs
      - name: Installed native dialog path persistence
        timeout-minutes: 4
        run: node scripts/verify-dialog-paths.mjs
      - name: Installed text bindings and image-aware review
        timeout-minutes: 8
        run: node scripts/verify-montage-bindings.mjs
      - name: Installed guided montage workflow
        timeout-minutes: 6
        run: node scripts/verify-montage-workflow.mjs
      - name: Installed timeline save and export edit lock
        timeout-minutes: 4
        run: node scripts/verify-timeline-working.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/${{ env.PACKAGE_VERSION }}/ZiyunStudio-Setup-*.exe
            release/${{ env.PACKAGE_VERSION }}/ZiyunStudio-*-mac-*.dmg
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-output/*/result.json
            test-output/*/*.png
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: assets
          merge-multiple: true
      - name: Verify local Windows package and publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$version"
          names=("ZiyunStudio-Setup-$version.exe" "ZiyunStudio-$version-mac-arm64.dmg" "ZiyunStudio-$version-mac-x64.dmg")
          for name in "${names[@]}"; do test -s "assets/$name"; done

          # The draft and Windows asset must have been prepared only after the
          # local installer passed installation checks. Never create a substitute.
          gh release view "$RELEASE_TAG" --json isDraft,tagName > existing.json
          jq -e --arg tag "$RELEASE_TAG" '.isDraft == true and .tagName == $tag' existing.json
          mkdir local-windows
          gh release download "$RELEASE_TAG" --pattern "${names[0]}" --dir local-windows
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const receipt = JSON.parse(fs.readFileSync(`.github/local-windows-${process.env.RELEASE_TAG}.json`, 'utf8'));
          const fileName = `ZiyunStudio-Setup-${version}.exe`;
          assert.equal(receipt.version, version, 'Local Windows receipt version differs from the tag');
          assert.equal(receipt.fileName, fileName, 'Local Windows receipt names a different installer');
          assert.ok(Number.isSafeInteger(receipt.size) && receipt.size > 0, 'Invalid installer size in local receipt');
          assert.match(receipt.sha256, /^[a-fA-F0-9]{64}$/, 'Invalid SHA256 in local receipt');
          const bytes = fs.readFileSync(`local-windows/${fileName}`);
          assert.equal(bytes.length, receipt.size, 'Draft Windows installer size differs from the locally verified package');
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), receipt.sha256.toLowerCase(), 'Draft Windows installer differs from the locally verified package');
          fs.copyFileSync(`local-windows/${fileName}`, `assets/${fileName}`);
          console.log(`Using locally verified Windows installer: ${fileName} (${bytes.length} bytes)`);
          NODE
          (cd assets && sha256sum "${names[@]}" > SHA256SUMS.txt)
          # Preserve the original local Windows attachment. Only the two tested
          # macOS packages and the final checksum file are uploaded by CI.
          gh release upload "$RELEASE_TAG" "assets/${names[1]}" "assets/${names[2]}" assets/SHA256SUMS.txt --clobber
          mkdir verify-download
          gh release download "$RELEASE_TAG" -D verify-download
          (cd verify-download && sha256sum --check --strict SHA256SUMS.txt)
          gh release view "$RELEASE_TAG" --json isDraft,tagName,assets > uploaded.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const names = [`ZiyunStudio-Setup-${version}.exe`, `ZiyunStudio-${version}-mac-arm64.dmg`, `ZiyunStudio-${version}-mac-x64.dmg`, 'SHA256SUMS.txt'];
          const release = JSON.parse(fs.readFileSync('uploaded.json', 'utf8'));
          assert.equal(release.isDraft, true, 'Release became public before verification finished');
          assert.equal(release.tagName, process.env.RELEASE_TAG);
          assert.deepEqual(release.assets.map(asset => asset.name).sort(), [...names].sort(), 'Draft has missing, duplicate, or unverified extra attachments');
          assert.deepEqual(fs.readdirSync('verify-download').sort(), [...names].sort(), 'Did not download the exact complete release');
          const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          for (const name of names) {
            const original = fs.readFileSync(`assets/${name}`);
            const downloaded = fs.readFileSync(`verify-download/${name}`);
            const asset = release.assets.find(asset => asset.name === name);
            assert.equal(downloaded.length, original.length, `${name}: downloaded size differs`);
            assert.equal(digest(downloaded), digest(original), `${name}: downloaded content differs`);
            assert.equal(asset.size, original.length, `${name}: GitHub size differs`);
            assert.equal(asset.digest, `sha256:${digest(original)}`, `${name}: GitHub digest differs`);
            assert.equal(asset.state, 'uploaded', `${name}: GitHub upload is incomplete`);
            console.log(`Verified remote attachment: ${name} (${original.length} bytes, ${digest(original)})`);
          }
          NODE
          gh release edit "$RELEASE_TAG" --draft=false --latest
